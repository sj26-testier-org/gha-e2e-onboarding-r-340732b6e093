name: watch--map-empty
on:
  watch: {}
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          token: ''
      - name: Execute source and complete event probe
        env:
          LAB_CASE: watch--map-empty
          EVENT_FAMILY: watch
          EXPR_EVENT: ${{ toJSON(github.event) }}
          EXPR_REF: ${{ github.ref }}
          EXPR_SHA: ${{ github.sha }}
          EXPR_ACTION: ${{ github.event.action }}
        run: node probe.cjs
  intentional-failure:
    runs-on: ubuntu-latest
    steps:
      - run: exit 23
  must-skip:
    needs: intentional-failure
    runs-on: ubuntu-latest
    steps:
      - run: echo UNEXPECTED_EXECUTION; exit 24
  observes-failure:
    needs: [intentional-failure, must-skip]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          FAILED_RESULT: ${{ needs.intentional-failure.result }}
          SKIPPED_RESULT: ${{ needs.must-skip.result }}
        run: test "$FAILED_RESULT" = failure && test "$SKIPPED_RESULT" = skipped
