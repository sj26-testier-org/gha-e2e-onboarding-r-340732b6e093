name: gollum--branches-ignore
on:
  gollum:
    branches-ignore: ["**"]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          token: ''
      - name: Execute complete event probe
        env:
          LAB_CASE: gollum--branches-ignore
          EVENT_FAMILY: gollum
          EXPR_EVENT: ${{ toJSON(github.event) }}
          EXPR_REF: ${{ github.ref }}
          EXPR_SHA: ${{ github.sha }}
          EXPR_ACTION: ${{ github.event.action }}
        run: node probe.cjs
