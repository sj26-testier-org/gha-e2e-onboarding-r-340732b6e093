name: pull_request_review_comment--types-null
on:
  pull_request_review_comment:
    types: null
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          token: ''
      - name: Execute complete event probe
        env:
          LAB_CASE: pull_request_review_comment--types-null
          EVENT_FAMILY: pull_request_review_comment
          EXPR_EVENT: ${{ toJSON(github.event) }}
          EXPR_REF: ${{ github.ref }}
          EXPR_SHA: ${{ github.sha }}
          EXPR_ACTION: ${{ github.event.action }}
        run: node probe.cjs
