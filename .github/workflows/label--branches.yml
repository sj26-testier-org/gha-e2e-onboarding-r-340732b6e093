{
  "name": "label--branches",
  "on": {
    "label": {
      "types": [
        "created"
      ],
      "branches": [
        "__lab_never_branch__"
      ]
    }
  },
  "permissions": {},
  "jobs": {
    "probe": {
      "name": "label--branches",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 5,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "22",
            "token": ""
          }
        },
        {
          "name": "Original event and source proof",
          "env": {
            "LAB_CASE": "label--branches",
            "EVENT_FAMILY": "${{ github.event_name }}",
            "EXPR_EVENT": "${{ toJSON(github.event) }}",
            "EXPR_REF": "${{ github.ref }}",
            "EXPR_SHA": "${{ github.sha }}",
            "EXPR_ACTION": "${{ github.event.action }}"
          },
          "run": "node probe.cjs"
        }
      ]
    }
  }
}
