name: discussion_comment--subset
on:
  discussion_comment:
    types: [created, edited]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          token: ''
      - name: Execute source and complete event probe
        env:
          LAB_CASE: discussion_comment--subset
          EVENT_FAMILY: discussion_comment
          EXPR_EVENT: ${{ toJSON(github.event) }}
          EXPR_REF: ${{ github.ref }}
          EXPR_SHA: ${{ github.sha }}
          EXPR_ACTION: ${{ github.event.action }}
        run: node probe.cjs
