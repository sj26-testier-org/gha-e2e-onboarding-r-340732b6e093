{
  "name": "delete--branches-ignore",
  "on": {
    "delete": {
      "branches-ignore": [
        "**"
      ]
    }
  },
  "permissions": {},
  "jobs": {
    "probe": {
      "name": "delete--branches-ignore",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 5,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "22",
            "token": ""
          }
        },
        {
          "name": "Original event and source proof",
          "env": {
            "LAB_CASE": "delete--branches-ignore",
            "EVENT_FAMILY": "${{ github.event_name }}",
            "EXPR_EVENT": "${{ toJSON(github.event) }}",
            "EXPR_REF": "${{ github.ref }}",
            "EXPR_SHA": "${{ github.sha }}",
            "EXPR_ACTION": "${{ github.event.action }}"
          },
          "run": "node probe.cjs"
        }
      ]
    }
  }
}
